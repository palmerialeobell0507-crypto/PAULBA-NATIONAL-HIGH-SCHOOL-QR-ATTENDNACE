<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Attendance · Creative Technologies</title>
<meta name="theme-color" content="#2f5d1e">
<!--
  QR CODE-BASED STUDENT ATTENDANCE MONITORING SYSTEM  ·  Web App (front end)
  Paulba National High School · Creative Technologies

  Host this single file on any HTTPS site (Netlify Drop / GitHub Pages).
  It talks to your Google Apps Script "Web app" URL.
  Paste that URL below OR the app will ask for it the first time it opens.
-->
<script>window.DEFAULT_API_URL = "";</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Spline+Sans:wght@400;500;600&family=Source+Code+Pro:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --leaf: oklch(0.545 0.141 127);
  --leaf-deep: oklch(0.34 0.075 130);
  --leaf-ink: oklch(0.26 0.05 130);
  --leaf-wash: oklch(0.955 0.03 125);
  --bg: oklch(0.985 0.006 110);
  --card: oklch(0.998 0.002 110);
  --text: oklch(0.27 0.02 124);
  --muted: oklch(0.50 0.03 124);
  --line: oklch(0.91 0.015 120);
  --present: oklch(0.55 0.14 135);
  --late: oklch(0.72 0.14 78);
  --late-ink: oklch(0.50 0.11 65);
  --absent: oklch(0.57 0.16 32);
  --out: oklch(0.55 0.08 205);
  --clay: oklch(0.536 0.111 61);
  --r: 14px;
  --font-display: "Quicksand", system-ui, sans-serif;
  --font-sans: "Spline Sans", system-ui, sans-serif;
  --font-mono: "Source Code Pro", ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-sans);font-size:16px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:-.01em}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--leaf-deep)}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.small{font-size:14px}
.hidden{display:none!important}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--leaf-deep);color:oklch(0.95 0.02 120);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{padding:4px 10px 18px}
.brand b{display:block;font-family:var(--font-display);font-size:19px;line-height:1.15}
.brand span{font-size:13px;opacity:.75}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:inherit;text-decoration:none;font-size:15px;opacity:.86;border:0;background:none;cursor:pointer;width:100%;text-align:left}
.nav:hover{background:oklch(1 0 0 / .08);opacity:1}
.nav.on{background:oklch(0.95 0.06 125);color:var(--leaf-ink);opacity:1;font-weight:600}
.nav svg{width:19px;height:19px;flex:none}
.nav .n{font-family:var(--font-mono);font-size:12px;opacity:.55;margin-left:auto}
.side .who{margin-top:auto;padding:14px 12px 4px;border-top:1px solid oklch(1 0 0 / .14);font-size:14px}
.side .who button{margin-top:8px}
.main{min-width:0;padding:28px clamp(16px,3vw,40px) 60px}
.topbar{display:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead p{margin:6px 0 0;color:var(--muted)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:500;white-space:nowrap;transition:transform .08s, background .15s}
.btn:hover{background:var(--leaf-wash)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--leaf-deep);border-color:var(--leaf-deep);color:#fff}
.btn.primary:hover{background:var(--leaf-ink)}
.btn.leaf{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.danger{color:var(--absent);border-color:oklch(0.85 0.06 30)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.btn.lg{padding:14px 22px;font-size:17px;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.side .btn{background:transparent;color:inherit;border-color:oklch(1 0 0 / .25)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--muted)}
label.f > span b{color:var(--absent)}
.in{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:16px;min-width:0;width:100%}
.in:focus,.btn:focus-visible{outline:3px solid oklch(0.80 0.12 125);outline-offset:1px;border-color:var(--leaf)}
textarea.in{min-height:110px;resize:vertical}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters .in{width:auto;min-width:150px}
.seg{display:inline-flex;background:oklch(0.94 0.015 120);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px oklch(0 0 0 / .08)}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{margin-bottom:12px}
.callout{border-radius:12px;padding:14px 16px;background:oklch(0.96 0.04 85);color:oklch(0.38 0.07 65);font-size:15px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.callout.ok{background:var(--leaf-wash);color:var(--leaf-ink)}
.callout.bad{background:oklch(0.95 0.035 30);color:oklch(0.42 0.12 30)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:15px}
th{position:sticky;top:0;background:oklch(0.965 0.012 120);text-align:left;font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 12px;white-space:nowrap;z-index:1}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:oklch(0.985 0.01 120)}
td.act{white-space:nowrap;text-align:right}
.empty{padding:40px;text-align:center;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-Present{background:oklch(0.94 0.05 135);color:oklch(0.40 0.11 135)}
.p-Late{background:oklch(0.95 0.06 85);color:var(--late-ink)}
.p-Absent{background:oklch(0.95 0.035 30);color:oklch(0.48 0.15 30)}
.p-Inside{background:oklch(0.94 0.05 135);color:oklch(0.40 0.11 135)}
.p-Out{background:oklch(0.94 0.03 205);color:oklch(0.42 0.07 205)}
.p-Inactive{background:oklch(0.94 0.005 120);color:var(--muted)}
.p-Sent{background:oklch(0.94 0.05 135);color:oklch(0.40 0.11 135)}
.p-Failed{background:oklch(0.95 0.035 30);color:oklch(0.48 0.15 30)}
.id{font-family:var(--font-mono);font-size:14px;color:var(--muted);white-space:nowrap}
td.mono{white-space:nowrap}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.board{background:var(--leaf-deep);color:#fff;border-radius:20px;padding:26px 28px;position:relative;overflow:hidden}
.board .big{font-family:var(--font-display);font-weight:700;font-size:clamp(54px,7vw,92px);line-height:.95;letter-spacing:-.03em}
.board .big small{font-size:.38em;opacity:.7;font-weight:600;letter-spacing:0}
.board .lbl{font-size:15px;opacity:.8;margin-top:6px}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:22px 0 14px;background:oklch(1 0 0 / .14)}
.stack i{display:block;height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:15px}
.legend b{font-family:var(--font-display);font-size:24px;display:block}
.legend span{display:flex;flex-direction:column}
.legend em{font-style:normal;opacity:.75;font-size:14px;display:flex;align-items:center;gap:6px}
.legend em::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.pulse{position:absolute;top:24px;right:26px;font-size:13px;display:flex;align-items:center;gap:8px;opacity:.85}
.pulse::before{content:"";width:8px;height:8px;border-radius:50%;background:oklch(0.85 0.17 130);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.flow{display:flex;flex-direction:column;gap:2px;max-height:330px;overflow:auto}
.flow .it{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px dashed var(--line)}
.flow .it .t{font-family:var(--font-mono);font-size:14px}
.flow .it.new{animation:slidein .5s ease-out}
@keyframes slidein{from{background:var(--leaf-wash);transform:translateY(-4px)}to{background:transparent;transform:none}}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:13px;color:var(--muted)}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--leaf);min-height:3px;transition:height .6s}
.bars div.today i{background:var(--leaf-deep)}
.meter{height:8px;border-radius:99px;background:oklch(0.94 0.015 120);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--present)}

/* ---------- scanner ---------- */
.scanwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.cam{background:oklch(0.22 0.03 130);border-radius:20px;overflow:hidden;position:relative;aspect-ratio:1/1;max-height:70vh;display:flex;align-items:center;justify-content:center;color:oklch(0.9 0.02 120)}
#reader{width:100%;height:100%}
#reader video{object-fit:cover!important;width:100%!important;height:100%!important}
.cam .idle{text-align:center;padding:30px;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.timecard{background:#fffdf6;border:1px solid oklch(0.90 0.03 90);border-radius:16px;padding:22px 24px;position:relative;min-height:290px;overflow:hidden;background-image:repeating-linear-gradient(transparent 0 37px, oklch(0.92 0.03 230 / .5) 37px 38px)}
.timecard .lbl{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.timecard .nm{font-family:var(--font-display);font-size:clamp(26px,3.4vw,38px);font-weight:700;line-height:1.1;margin:8px 0 4px}
.timecard .meta{color:var(--muted)}
.stamp{position:absolute;right:20px;bottom:22px;border:4px solid var(--ink);color:var(--ink);border-radius:10px;padding:8px 14px;font-family:var(--font-mono);font-weight:700;text-align:center;transform:rotate(-7deg);opacity:.92;mix-blend-mode:multiply;--ink:var(--present)}
.stamp b{display:block;font-size:30px;line-height:1}
.stamp span{font-size:15px;letter-spacing:.12em}
.stamp.go{animation:stampdown .38s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stampdown{0%{transform:rotate(-14deg) scale(1.9);opacity:0}60%{opacity:1}100%{transform:rotate(-7deg) scale(1);opacity:.92}}
.timecard.flash{animation:flash .6s ease-out}
@keyframes flash{from{box-shadow:0 0 0 8px var(--flash)}to{box-shadow:0 0 0 0 transparent}}
.scanlog{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.scanlog .it{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}

/* ---------- QR cards ---------- */
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.qrcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.qrcard canvas{width:100%;height:auto;border-radius:8px}
.qrcard .nm{font-size:14px;font-weight:600;line-height:1.25}

/* ---------- modal + toast ---------- */
.veil{position:fixed;inset:0;background:oklch(0.2 0.03 130 / .45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .15s}
.modal{background:var(--card);border-radius:18px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 30px 80px oklch(0 0 0 / .25)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
@keyframes fade{from{opacity:0}}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,440px)}
.toast{background:var(--leaf-ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;box-shadow:0 10px 30px oklch(0 0 0 / .2);animation:fade .2s}
.toast.bad{background:oklch(0.45 0.14 30)}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth .art{background:var(--leaf-deep);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth .art h1{font-size:clamp(34px,4.4vw,58px);line-height:1.02;max-width:12ch}
.auth .art .qrs{position:absolute;right:-40px;bottom:-40px;opacity:.12}
.auth .form{display:flex;align-items:center;justify-content:center;padding:32px}
.auth .form .box{width:min(380px,100%);display:flex;flex-direction:column;gap:16px}

/* ---------- print ---------- */
#printzone{display:none}
@media print{
  body *{visibility:hidden}
  #printzone,#printzone *{visibility:visible}
  #printzone{display:block;position:absolute;inset:0}
  .psheet{display:grid;grid-template-columns:repeat(4,1fr);gap:6mm;page-break-after:always;padding:4mm}
  .psheet img{width:100%;border:0.3mm dashed #999;border-radius:3mm}
  .preport{font-family:Arial,sans-serif;font-size:11px}
  .preport table{font-size:10px}
  .preport th{position:static;background:#eee;color:#000}
  @page{size:A4;margin:8mm}
}

@media (max-width: 1000px){
  .hero,.scanwrap,.g3{grid-template-columns:1fr}
}
@media (max-width: 760px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax oklch(0 0 0 / .35)}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--leaf-deep);color:#fff;position:sticky;top:0;z-index:30}
  .topbar b{font-family:var(--font-display)}
  .main{padding:18px 14px 60px}
  .g2{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}
  .auth .art{padding:28px;min-height:220px}
  h1{font-size:25px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<div id="printzone"></div>
<script>
/* =====================================================================
   APP CORE
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const S = {
  api: localStorage.getItem('qa_api') || window.DEFAULT_API_URL || '',
  token: sessionStorage.getItem('qa_token') || localStorage.getItem('qa_token_kiosk') || '',
  user: null, settings: {}, grades: [], sections: [], groups: [], today: '',
  students: null, view: '', timers: []
};

async function api(action, data = {}) {
  if (!S.api) throw new Error('System link not set.');
  let res;
  try {
    res = await fetch(S.api, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: S.token, data })
    });
  } catch (e) {
    throw new Error('Cannot reach the system. Check the internet connection.');
  }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('The system link did not answer correctly. Check the Web App URL and deployment access ("Anyone").'); }
  if (!j.ok) {
    if (j.code === 'AUTH' && action !== 'login') { logout(true); }
    const err = new Error(j.error || 'Something went wrong.'); err.code = j.code; throw err;
  }
  return j.data;
}

function toast(msg, bad = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3500);
}

function modal(title, html, onMount) {
  const v = document.createElement('div');
  v.className = 'veil';
  v.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2><button class="btn ghost" data-x aria-label="Close">✕</button></div><div class="mb">${html}</div></div>`;
  const close = () => { v.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  v.addEventListener('click', e => { if (e.target === v || e.target.closest('[data-x]')) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(v);
  close.el = $('.mb', v);
  if (onMount) onMount(close.el, close);
  return close;
}

async function busy(btn, fn) {
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try { return await fn(); }
  catch (e) { toast(e.message, true); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}

/* ---------- time helpers ---------- */
const to12 = t => {
  if (!t) return '';
  const [h, m] = String(t).split(':').map(Number);
  if (isNaN(h)) return t;
  return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
};
const longDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd).toLocaleDateString('en-PH', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); };
const shortDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd).toLocaleDateString('en-PH', { month: 'short', day: 'numeric' }); };
const dayName = d => { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd).toLocaleDateString('en-PH', { weekday: 'short' }); };
const localYmd = (dt = new Date()) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const pretty = n => { let s = String(n || ''); const p = s.split(','); if (p.length >= 2) s = p.slice(1).join(' ').trim() + ' ' + p[0].trim(); return s.toLowerCase().replace(/(^|[\s.\-'])([a-zñ])/g, (m, a, b) => a + b.toUpperCase()).replace(/\s+/g, ' '); };
const badge = (text, cls) => `<span class="pill p-${cls}">${esc(text)}</span>`;
const pill = (s) => `<span class="pill p-${esc(s)}">${esc(s)}</span>`;
const notifPill = (txt) => {
  if (!txt) return '<span class="muted small">–</span>';
  const parts = String(txt).split('|').map(x => x.trim());
  return parts.map(p => { const [ch, st] = p.split(':').map(x => (x || '').trim()); const cls = st === 'Sent' ? 'Sent' : (st === 'Failed' ? 'Failed' : 'Inactive'); return `<span class="pill p-${cls}" title="${esc(p)}">${esc(ch)}</span>`; }).join(' ');
};

/* ---------- icons ---------- */
const I = {

/* ---------- boot ---------- */
async function boot() {
  if (!S.api) return renderConnect();
  if (!S.token) return renderLogin();
  try {
    const b = await api('bootstrap');
    Object.assign(S, { user: b.user, settings: b.settings, grades: b.grades || [], sections: b.sections || [], groups: b.groups || [], today: b.today });
    renderShell();
    const want = location.hash.slice(1);
    go(allowed(want) ? want : (S.user.role === 'Scanner' ? 'scanner' : 'dashboard'));
  } catch (e) {
    if (e.code !== 'AUTH') toast(e.message, true);
    renderLogin();
  }
}
const allowed = v => { const n = NAV.find(x => x[0] === v); return n && S.user && n[2].includes(S.user.role); };

function renderConnect() {
  $('#app').innerHTML = `
  <div class="auth"><div class="art"><div class="small" style="opacity:.8">First-time setup</div>
    <h1>Connect this device to your attendance sheet.</h1>
    <div class="small" style="opacity:.8">Paste the Web App URL you copied from Google Apps Script (Deploy → Web app). It ends with <span class="mono">/exec</span>.</div></div>
  <div class="form"><div class="box">
    <h2>System link</h2>
    <label class="f"><span>Web App URL</span><input class="in mono" id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <button class="btn primary lg" id="connectBtn" type="button">Connect</button>
    <p class="muted small">Saved on this device only. You can change it later from the login screen.</p>
  </div></div></div>`;
  const go_ = () => busy($('#connectBtn'), async () => {
    const url = $('#apiUrl').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) throw new Error('That does not look like a Web App URL (must end with /exec).');
    S.api = url;
    const p = await api('ping');
    localStorage.setItem('qa_api', url);
    toast('Connected to ' + p.school);
    renderLogin();
  });
  $('#connectBtn').onclick = go_;
  $('#apiUrl').onkeydown = e => { if (e.key === 'Enter') go_(); };
}

function renderLogin() {
  stopTimers(); stopCamera();
  $('#app').innerHTML = `
  <div class="auth">
    <div class="art">
      <div class="small" style="opacity:.85" id="schoolName">Attendance System</div>
      <h1>Scan in. Scan out. Parents know.</h1>
      <div class="small" style="opacity:.8">Creative Technologies · QR attendance</div>
      <svg class="qrs" width="320" height="320" viewBox="0 0 7 7" fill="#fff"><path d="M0 0h3v3H0zM4 0h3v3H4zM0 4h3v3H0zM4 4h1v1H4zM6 4h1v1H6zM5 5h1v1H5zM4 6h1v1H4zM6 6h1v1H6z"/></svg>
    </div>
    <div class="form"><div class="box">
      <h2>Log in</h2>
      <label class="f"><span>Username</span><input class="in" id="lu" autocomplete="username" autocapitalize="none"></label>
      <label class="f"><span>PIN</span><input class="in mono" id="lp" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8"></label>
      <label class="row small muted"><input type="checkbox" id="kiosk"> Keep this device logged in (scanner kiosk)</label>
      <button class="btn primary lg" id="loginBtn" type="button">Log in</button>
      <button class="btn ghost sm" id="changeLink" type="button">Change system link</button>
    </div></div>
  </div>`;
  api('ping').then(p => { $('#schoolName') && ($('#schoolName').textContent = p.school); }).catch(() => {});
  const doLogin = () => busy($('#loginBtn'), async () => {
    const r = await api('login', { username: $('#lu').value, pin: $('#lp').value });
    S.token = r.token;
    sessionStorage.setItem('qa_token', r.token);
    if ($('#kiosk').checked) localStorage.setItem('qa_token_kiosk', r.token); else localStorage.removeItem('qa_token_kiosk');
    await boot();
  });
  $('#loginBtn').onclick = doLogin;
  $('#lp').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
  $('#lu').onkeydown = e => { if (e.key === 'Enter') $('#lp').focus(); };
  $('#changeLink').onclick = () => { localStorage.removeItem('qa_api'); S.api = ''; renderConnect(); };
  $('#lu').focus();
}

function logout(silent) {
  if (!silent && S.token) api('logout').catch(() => {});
  S.token = ''; S.user = null; S.students = null;
  sessionStorage.removeItem('qa_token'); localStorage.removeItem('qa_token_kiosk');
  renderLogin();
}

function renderShell() {
  const items = NAV.filter(n => n[2].includes(S.user.role));
  $('#app').innerHTML = `
  <div class="topbar"><button class="btn sm" id="menuBtn" style="background:transparent;color:#fff;border-color:#ffffff55" type="button">☰ Menu</button><b>${esc(S.settings.subject)}</b><span></span></div>
  <div class="shell">
    <aside class="side" id="side">
      <div class="brand"><b>${esc(S.settings.school)}</b><span>${esc(S.settings.subject)} · Attendance</span></div>
      ${items.map((n, i) => `<button class="nav" data-go="${n[0]}" type="button">${icon(n[0])}<span>${n[1]}</span><span class="n">${String(i + 1).padStart(2, '0')}</span></button>`).join('')}
      <div class="who"><div><b>${esc(S.user.fullName)}</b></div><div style="opacity:.7">${esc(S.user.role)}</div><button class="btn sm" id="logoutBtn" type="button">Log out</button></div>
    </aside>
    <main class="main" id="view"></main>
  </div>`;
  $$('.nav').forEach(b => b.onclick = () => { go(b.dataset.go); $('#side').classList.remove('open'); });
  $('#logoutBtn').onclick = () => logout();
  $('#menuBtn').onclick = () => $('#side').classList.toggle('open');
  $('#side').addEventListener('click', e => { if (e.target.id === 'side') $('#side').classList.remove('open'); });
}

function stopTimers() { S.timers.forEach(clearInterval); S.timers = []; }
function every(ms, fn) { S.timers.push(setInterval(() => { if (!document.hidden) fn(); }, ms)); }

function go(view) {
  if (!allowed(view)) view = S.user.role === 'Scanner' ? 'scanner' : 'dashboard';
  stopTimers();
  if (view !== 'scanner') stopCamera();
  S.view = view;
  history.replaceState(null, '', '#' + view);
  $$('.nav').forEach(b => b.classList.toggle('on', b.dataset.go === view));
  const v = $('#view');
  v.innerHTML = '<div class="empty"><span class="spin"></span></div>';
  window.scrollTo(0, 0);
  VIEWS[view](v);
}

async function getStudents(force) {
  if (!S.students || force) S.students = await api('listStudents');
  return S.students;
}

function groupOptions(selected = '') {
  return `<option value="">All grades & sections</option>` + S.groups.map(g => { const [gr, se] = g.split('|'); return `<option value="${esc(g)}" ${g === selected ? 'selected' : ''}>${esc(gr)} – ${esc(se)}</option>`; }).join('');
}
const splitGroup = v => { const [grade = '', section = ''] = (v || '').split('|'); return { grade, section }; };

function head(title, sub, right = '') {
  return `<div class="pagehead"><div><h1>${esc(title)}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="row">${right}</div></div>`;
}

/* =====================================================================
   1. DASHBOARD
   ===================================================================== */
const VIEWS = {};
VIEWS.dashboard = async (v) => {
  let date = S.today || localYmd();
  v.innerHTML = head('Dashboard', '', `<input type="date" class="in" id="dDate" value="${date}" style="width:auto"><button class="btn" id="dRefresh" type="button">Refresh</button>`) + '<div id="dBody"><div class="empty"><span class="spin"></span></div></div>';
  let lastIds = new Set();
  const load = async () => {
    try {
      const d = await api('day', { date });
      const attended = d.present + d.late;
      const pct = x => d.total ? (x * 100 / d.total) : 0;
      const isToday = date === S.today;
      const newIds = new Set(d.records.map(r => r.recordId + (r.timeOut ? 'o' : 'i')));
      $('#dBody').innerHTML = `
      <div class="hero">
        <div class="board">
          ${isToday ? `<div class="pulse">Live · ${to12(d.serverTime)}</div>` : ''}
          <div class="lbl">${esc(longDate(date))}</div>
          <div class="big">${attended}<small> / ${d.total} in class</small></div>
          <div class="stack" aria-hidden="true">
            <i style="width:${pct(d.present)}%;background:oklch(0.80 0.16 130)"></i>
            <i style="width:${pct(d.late)}%;background:var(--late)"></i>
            <i style="width:${pct(d.absent)}%;background:oklch(0.66 0.14 35)"></i>
          </div>
          <div class="legend">
            <span><b>${d.present}</b><em style="--c:oklch(0.80 0.16 130)">On time</em></span>
            <span><b>${d.late}</b><em style="--c:var(--late)">Late</em></span>
            <span><b>${d.absent}</b><em style="--c:oklch(0.66 0.14 35)">${isToday ? 'Not yet in' : 'Absent'}</em></span>
            <span><b>${d.inside}</b><em style="--c:#fff">Still inside</em></span>
            <span><b>${d.out}</b><em style="--c:var(--out)">Timed out</em></span>
          </div>
        </div>
        <div class="card"><h3>Last 7 days</h3>
          <div class="bars">${(() => { const mx = Math.max(1, ...d.trend.map(t => t.attended)); return d.trend.map(t => `<div class="${t.date === date ? 'today' : ''}" title="${t.attended} scans"><span>${t.attended || ''}</span><i style="height:${t.attended * 80 / mx}%"></i><span>${dayName(t.date)}</span></div>`).join(''); })()}</div>
          <p class="muted small" style="margin:12px 0 0">Students with a TIME IN per day.</p>
        </div>
      </div>
      <div class="grid g3">
        <div class="card"><h3>By section</h3>
          <table><tbody>${d.groups.map(g => { const r = g.total ? Math.round((g.present + g.late) * 100 / g.total) : 0; return `<tr><td><b>${esc(g.grade)}</b><div class="muted small">${esc(g.section)}</div></td><td style="width:42%"><div class="meter"><i style="width:${r}%"></i></div><div class="muted small" style="margin-top:4px">${g.present + g.late}/${g.total} · ${g.late} late</div></td><td class="mono" style="text-align:right">${r}%</td></tr>`; }).join('') || '<tr><td class="empty">No students yet</td></tr>'}</tbody></table>
        </div>
        <div class="card"><h3>Latest scans</h3>
          <div class="flow">${d.records.slice(0, 30).map(r => { const k = r.recordId + (r.timeOut ? 'o' : 'i'); return `<div class="it ${lastIds.size && !lastIds.has(k) ? 'new' : ''}"><span class="t">${to12(r.timeOut || r.timeIn)}</span><span><b>${esc(pretty(r.name))}</b><div class="muted small">${esc(r.grade)} · ${esc(r.section)}</div></span>${r.timeOut ? pill('Out') : pill(r.status)}</div>`; }).join('') || '<div class="empty">No scans yet</div>'}</div>
        </div>
        <div class="card"><h3>${isToday ? 'Not yet in' : 'Absent'} <span class="muted small">(${d.absentList.length})</span></h3>
          <div class="flow">${d.absentList.slice(0, 200).map(s => `<div class="it" style="grid-template-columns:1fr auto"><span><b>${esc(pretty(s.name))}</b><div class="muted small">${esc(s.grade)} · ${esc(s.section)}</div></span><button class="btn sm" data-hist="${esc(s.id)}" type="button">History</button></div>`).join('') || '<div class="empty">Everyone is here 🎉</div>'}</div>
        </div>
      </div>`;
      lastIds = newIds;
      $$('[data-hist]', $('#dBody')).forEach(b => b.onclick = () => openHistory(b.dataset.hist));
    } catch (e) { toast(e.message, true); }
  };
  $('#dDate').onchange = e => { date = e.target.value || S.today; load(); };
  $('#dRefresh').onclick = load;
  await load();
  every(20000, () => { if (date === S.today) load(); });
};

   2. STUDENT REGISTRATION

const GRADE_LIST = ['Grade 7', 'Grade 8', 'Grade 9', 'Grade 10', 'Grade 11', 'Grade 12'];

function studentForm(st = {}, edit = false) {
  const grades = [...new Set([...GRADE_LIST, ...S.grades])];
  return `
  <div class="grid g2">
    <label class="f"><span>Student ID ${edit ? '' : '<span class="muted">(leave blank = automatic)</span>'}</span><input class="in mono" name="id" value="${esc(st.id)}" ${edit ? 'readonly' : ''} placeholder="e.g. PNHS-G7-019 or LRN"></label>
    <label class="f"><span>Full name <b>*</b> <span class="muted">(SURNAME, First M.)</span></span><input class="in" name="name" value="${esc(st.name)}" placeholder="DELA CRUZ, JUAN P."></label>
    <label class="f"><span>Sex</span><select class="in" name="sex"><option value="">–</option><option ${st.sex === 'Male' ? 'selected' : ''}>Male</option><option ${st.sex === 'Female' ? 'selected' : ''}>Female</option></select></label>
    <label class="f"><span>Grade level <b>*</b></span><select class="in" name="grade"><option value="">Choose…</option>${grades.map(g => `<option ${g === st.grade ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></label>
    <label class="f"><span>Section <b>*</b></span><input class="in" name="section" list="secList" value="${esc(st.section)}" placeholder="MAKADIYOS"><datalist id="secList">${S.sections.map(s => `<option value="${esc(s)}">`).join('')}</datalist></label>
    <label class="f"><span>Parent/Guardian name</span><input class="in" name="guardian" value="${esc(st.guardian)}"></label>
    <label class="f"><span>Parent/Guardian mobile <span class="muted">(for SMS)</span></span><input class="in mono" name="contact" value="${esc(st.contact)}" inputmode="tel" placeholder="09XXXXXXXXX"></label>
    <label class="f"><span>Parent/Guardian email</span><input class="in" name="email" type="email" value="${esc(st.email)}" placeholder="parent@gmail.com"></label>
  </div>`;
}
const readForm = el => Object.fromEntries($$('[name]', el).map(i => [i.name, i.value]));

VIEWS.register = (v) => {
  v.innerHTML = head('Student Registration', 'New students get a unique QR code the moment you save.', S.user.role === 'Admin' ? '<button class="btn" id="bulkBtn" type="button">Bulk add from Excel</button>' : '') + `
  <div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start" id="regGrid">
    <div class="card" id="regForm">${studentForm()}<div class="row" style="margin-top:18px"><button class="btn primary lg" id="saveBtn" type="button">Register student</button><button class="btn ghost" id="clearBtn" type="button">Clear</button></div></div>
    <div class="card" id="regResult"><h3>QR card preview</h3><p class="muted">Fill the form and save. The student's printable QR card appears here.</p></div>
  </div>`;
  if (window.innerWidth < 1000) $('#regGrid').style.gridTemplateColumns = '1fr';
  const save = (force) => busy($('#saveBtn'), async () => {
    try {
      const r = await api('saveStudent', { ...readForm($('#regForm')), force });
      S.students = null;
      const st = r.student;
      if (!S.groups.includes(st.grade + '|' + st.section)) { S.groups.push(st.grade + '|' + st.section); S.groups.sort(); }
      if (!S.sections.includes(st.section)) S.sections.push(st.section);
      toast(`${pretty(st.name)} registered · ${st.id}`);
      showCardIn($('#regResult'), st);
      $$('[name]', $('#regForm')).forEach(i => { if (!['grade', 'section'].includes(i.name)) i.value = ''; });
      $('[name=name]', $('#regForm')).focus();
    } catch (e) {
      if (e.code === 'DUP_NAME' && confirm(e.message + '\n\nRegister anyway as a different student?')) return save(true);
      throw e;
    }
  });
  $('#saveBtn').onclick = () => save(false);
  $('#clearBtn').onclick = () => $$('[name]', $('#regForm')).forEach(i => { if (!i.readOnly) i.value = ''; });
  $('#bulkBtn') && ($('#bulkBtn').onclick = bulkImport);
};

function bulkImport() {
  modal('Bulk add students', `
    <p class="muted">Copy rows from Excel and paste below. Column order:<br><span class="mono small">Full Name · Sex · Grade Level · Section · Guardian Name · Guardian Mobile · Guardian Email</span></p>
    <textarea class="in mono" id="bulkTxt" style="min-height:200px" placeholder="DELA CRUZ, JUAN P.	Male	Grade 7	MAKADIYOS	Maria Dela Cruz	09171234567	maria@gmail.com"></textarea>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="bulkGo" type="button">Import</button><span class="muted small" id="bulkInfo"></span></div>`, (el, close) => {
    $('#bulkTxt', el).oninput = () => { const n = $('#bulkTxt', el).value.trim().split('\n').filter(Boolean).length; $('#bulkInfo', el).textContent = n ? n + ' row(s) ready' : ''; };
    $('#bulkGo', el).onclick = () => busy($('#bulkGo', el), async () => {
      const rows = $('#bulkTxt', el).value.split('\n').map(l => l.split('\t')).filter(c => c[0] && c[0].trim())
        .map(c => ({ name: c[0], sex: (c[1] || '').trim().toUpperCase().startsWith('F') ? 'Female' : ((c[1] || '').trim().toUpperCase().startsWith('M') ? 'Male' : ''), grade: (c[2] || '').trim(), section: c[3], guardian: c[4], contact: c[5], email: c[6] }));
      const r = await api('importStudents', { rows });
      S.students = null;
      toast(`${r.added} student(s) added`);
      if (r.skipped.length) alert('Skipped:\n' + r.skipped.join('\n'));
      close();
      const b = await api('bootstrap'); Object.assign(S, { grades: b.grades, sections: b.sections, groups: b.groups });
    });
  });
}

VIEWS.students = async (v) => {
  const st = await getStudents(true).catch(e => { toast(e.message, true); return []; });
  const missing = st.filter(s => s.status === 'Active' && !s.contact && !s.email).length;
  v.innerHTML = head('Student Database', `${st.length} students registered`, `<button class="btn" id="xlsBtn" type="button">Export to Excel</button><button class="btn primary" type="button" onclick="go('register')">+ Register</button>`) + `
  ${missing ? `<div class="callout"><span><b>${missing} active students</b> have no parent mobile or email yet, so their parents won't get notified.</span><button class="btn sm" id="showMissing" type="button">Show them</button></div>` : ''}
  <div class="filters">
    <input class="in" id="q" placeholder="Search name or ID" style="min-width:220px">
    <select class="in" id="grp">${groupOptions()}</select>
    <select class="in" id="stat"><option value="">Any status</option><option>Active</option><option>Inactive</option><option value="missing">Missing parent contact</option></select>
  </div>
  <div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Sex</th><th>Grade · Section</th><th>Parent/Guardian</th><th>Mobile</th><th>Email</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw = () => {
    const q = $('#q').value.trim().toUpperCase(), g = splitGroup($('#grp').value), sv = $('#stat').value;
    const rows = st.filter(s => (!q || s.name.toUpperCase().includes(q) || s.id.toUpperCase().includes(q)) && (!g.grade || (s.grade === g.grade && s.section === g.section)) &&
      (!sv || (sv === 'missing' ? (!s.contact && !s.email) : s.status === sv)));
    $('#tb').innerHTML = rows.map(s => `<tr>
      <td class="id">${esc(s.id)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.sex ? s.sex[0] : '')}</td><td>${esc(s.grade)} · ${esc(s.section)}</td>

/* =====================================================================
   4. QR CODE GENERATOR  (cards are drawn in the browser, nothing leaves the device)
   ===================================================================== */
function qrModules(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount();
  return { n, dark: (r, c) => q.isDark(r, c) };
}

function drawQr(ctx, text, x, y, size, color = '#1d2a14') {
  const m = qrModules(text), quiet = 2, cell = size / (m.n + quiet * 2);
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, size, size);
  ctx.fillStyle = color;
  for (let r = 0; r < m.n; r++) for (let c = 0; c < m.n; c++) if (m.dark(r, c)) ctx.fillRect(Math.floor(x + (c + quiet) * cell), Math.floor(y + (r + quiet) * cell), Math.ceil(cell), Math.ceil(cell));
}

function wrapLines(ctx, text, maxW) {
  const words = String(text).split(' '); const lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  return lines;
}

/** Portrait ID card 54 × 86 mm at ~300dpi */
function cardCanvas(s) {
  const W = 640, H = 1010, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#fbfdf7'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#2f5d1e'; x.fillRect(0, 0, W, 200);
  x.fillStyle = '#9fd36a'; x.fillRect(0, 200, W, 10);
  x.fillStyle = '#fff'; x.textAlign = 'center';
  x.font = '700 36px Quicksand, sans-serif';
  wrapLines(x, S.settings.school || 'School', W - 70).slice(0, 2).forEach((l, i, a) => x.fillText(l, W / 2, (a.length > 1 ? 72 : 92) + i * 42));
  x.font = '500 24px "Spline Sans", sans-serif'; x.globalAlpha = .85;
  x.fillText((S.settings.subject || '') + ' · Attendance Card', W / 2, 168); x.globalAlpha = 1;
  drawQr(x, s.qr, 90, 245, 460);
  x.fillStyle = '#1f2a17'; x.font = '700 40px Quicksand, sans-serif';
  const nm = pretty(s.name);
  const lines = wrapLines(x, nm, W - 70).slice(0, 2);
  lines.forEach((l, i) => x.fillText(l, W / 2, 768 + i * 46));
  const yy = 768 + lines.length * 46;
  x.font = '500 27px "Spline Sans", sans-serif'; x.fillStyle = '#4b5741';
  x.fillText(`${s.grade} · ${s.section}`, W / 2, yy + 12);
  x.font = '700 28px "Source Code Pro", monospace'; x.fillStyle = '#2f5d1e';
  x.fillText(s.id, W / 2, yy + 62);
  x.font = '400 19px "Spline Sans", sans-serif'; x.fillStyle = '#7a856f';
  x.fillText('Scan at the door for TIME IN and TIME OUT', W / 2, H - 30);
  return c;
}

const cardName = s => `${s.id}_${pretty(s.name).replace(/[^A-Za-z0-9ñÑ]+/g, '_')}.png`;
function downloadBlob(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
function downloadCard(s) { cardCanvas(s).toBlob(b => downloadBlob(b, cardName(s)), 'image/png'); }

function printCards(list) {
  if (!list.length) return toast('Nothing to print', true);
  const per = 8, pages = [];
  for (let i = 0; i < list.length; i += per) pages.push(list.slice(i, i + per));
  $('#printzone').innerHTML = pages.map(p => `<div class="psheet">${p.map(s => `<img src="${cardCanvas(s).toDataURL('image/png')}">`).join('')}</div>`).join('');
  setTimeout(() => { window.print(); }, 300);
}

function showCardIn(el, s) {
  el.innerHTML = `<h3>QR card ready</h3><div style="max-width:260px;margin:0 auto"></div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-dl type="button">Download PNG</button><button class="btn" data-pr type="button">Print</button></div>`;
  const c = cardCanvas(s); c.style.width = '100%'; c.style.borderRadius = '12px'; c.style.border = '1px solid var(--line)';
  el.children[1].appendChild(c);
  $('[data-dl]', el).onclick = () => downloadCard(s);
  $('[data-pr]', el).onclick = () => printCards([s]);
}
function openCard(s) { modal(pretty(s.name), '<div></div>', el => showCardIn(el.firstChild, s)); }

/* =====================================================================

   ===================================================================== */
let CAM = null;
const SCAN = { last: '', lastAt: 0, queue: [], busy: false, log: [] };

async function stopCamera() {
  if (CAM) { try { if (CAM.isScanning) await CAM.stop(); CAM.clear(); } catch (e) { } CAM = null; }
}

let audioCtx;
function beep(ok) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const tones = ok ? [[880, 0], [1320, .11]] : [[220, 0], [180, .16]];
    tones.forEach(([f, t]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = ok ? 'sine' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.25, audioCtx.currentTime + t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + t + .14);
      o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .16);
    });
    if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 60, 80]);
  } catch (e) { }
}

  const showResult = (r, ok) => {

    $('#tcNote').textContent = note; $('#tcNote').style.whiteSpace = 'pre-line';
    st.classList.remove('hidden', 'go'); void st.offsetWidth; st.classList.add('go');
    st.style.setProperty('--ink', ink);
    $('#stampTop').textContent = ok ? (r.result === 'TIME_OUT' ? 'TIME OUT' : (r.status === 'Late' ? 'LATE · IN' : 'TIME IN')) : ({ DUPLICATE: 'ALREADY IN', COMPLETE: 'DONE TODAY', INVALID: 'INVALID', INACTIVE: 'INACTIVE', NO_TIME_IN: 'NO TIME IN' }[r.result] || 'ERROR');
    $('#stampTime').textContent = ok ? to12(r.time) : '✕';

    beep(ok);
    SCAN.log.unshift({ name: r.student ? pretty(r.student.name) : 'Unknown code', what: ok ? $('#stampTop').textContent + ' ' + to12(r.time) : $('#stampTop').textContent, ok });

  };

  // camera
  Html5Qrcode.getCameras().then(cs => { $('#camSel').innerHTML = '<option value="">Back camera (default)</option>' + cs.map(c => `<option value="${esc(c.id)}">${esc(c.label || 'Camera')}</option>`).join(''); }).catch(() => { });
  $('#startCam').onclick = async () => {

  // keyboard-wedge scanners type the code then press Enter

      SCAN.queue.push({ manual: { studentId: id, event: b.dataset.man, remarks: $('#manWhy').value } }); run();
      $('#manQ').value = '';

  }
};

    <label class="f"><span>To</span><input class="in" type="date" id="ht" value="${t}"></label>
    <label class="f"><span>Grade · Section</span><select class="in" id="hg">${groupOptions()}</select></label>
    <label class="f"><span>Status</span><select class="in" id="hs"><option value="">All</option><option>Present</option><option>Late</option><option>Absent</option></select></label>
    <label class="f"><span>Student</span><input class="in" id="hn" placeholder="Name or ID"></label>
    <button class="btn primary" id="hgo" type="button">Show</button>
  </div>
  <div id="hsum" class="muted small" style="margin-bottom:10px"></div>
  <div class="tablewrap"><table><thead><tr><th>Date</th><th>Student</th><th>Grade · Section</th><th>Time In</th><th>Time Out</th><th>Status</th><th>Remarks</th><th></th></tr></thead><tbody id="tb"><tr><td colspan="8" class="empty"><span class="spin"></span></td></tr></tbody></table></div>`;

    const g = splitGroup($('#hg').value);

    const c = k => d.rows.filter(r => r.status === k).length;
    $('#hsum').textContent = `${d.total} row(s) · ${d.classDays} class day(s) · Present ${c('Present')} · Late ${c('Late')} · Absent ${c('Absent')}${d.truncated ? ' · showing first 3000' : ''}`;

/* ---------- Excel export (SheetJS, runs in the browser) ---------- */
function exportXlsx(name, sheets) {
  if (!window.XLSX) return toast('Excel library did not load. Check internet.', true);
  const wb = XLSX.utils.book_new();
  sheets.forEach(s => {
    const ws = XLSX.utils.aoa_to_sheet(s.rows);
    const widths = []; s.rows.forEach(r => r.forEach((c, i) => { widths[i] = Math.min(45, Math.max(widths[i] || 8, String(c ?? '').length + 2)); }));
    ws['!cols'] = widths.map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0, 31));
  });
  XLSX.writeFile(wb, name.replace(/[^\w.-]+/g, '_') + '.xlsx');
  toast('Excel file downloaded');
}
